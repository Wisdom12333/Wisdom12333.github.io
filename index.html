<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisdom12333</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0c0e;
      --surface: #131316;
      --border: #1e1e23;
      --text: #e2e2e6;
      --muted: #5a5a66;
      --accent: #7eb8f7;
      --accent-dim: rgba(126, 184, 247, 0.12);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot-red    { background: #3a1a1a; border: 1px solid #5c2a2a; }
    .dot-yellow { background: #2e2a14; border: 1px solid #4e461e; }
    .dot-green  { background: #152818; border: 1px solid #1e4025; }

    .titlebar-label {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .body {
      padding: 40px 36px 44px;
    }

    .prompt-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .prompt-line span {
      color: var(--accent);
    }

    h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      transition: background 0.15s, border-color 0.15s;
    }

    .link-row:hover {
      background: var(--accent-dim);
      border-color: rgba(126, 184, 247, 0.2);
    }

    .link-key {
      color: var(--accent);
      font-size: 11px;
      min-width: 32px;
      letter-spacing: 0.04em;
    }

    .link-label {
      color: var(--muted);
      font-size: 11px;
      margin-left: auto;
      letter-spacing: 0.03em;
    }

    .footer {
      padding: 14px 36px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3a9e5f;
      margin-right: 6px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    @media (max-width: 520px) {
      .body { padding: 28px 24px 32px; }
      .footer { padding: 14px 24px; }
      h1 { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .status-dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <span class="titlebar-label">~/wisdom12333</span>
    </div>

    <div class="body">
      <div class="prompt-line"><span>~</span> whoami</div>

      <h1>Wisdom12333<span class="cursor"></span></h1>
      <p class="tagline">building things on the internet.</p>

      <div class="divider"></div>

      <div class="links">
        <a class="link-row" href="mailto:wisdom12333@icloud.com">
          <span class="link-key">mail</span>
          wisdom12333@icloud.com
          <span class="link-label">↗</span>
        </a>
        <a class="link-row" href="https://github.com/Wisdom12333" target="_blank" rel="noopener">
          <span class="link-key">gh</span>
          github.com/Wisdom12333
          <span class="link-label">↗</span>
        </a>
      </div>
    </div>

    <div class="footer">
      <span><span class="status-dot"></span>online</span>
      <span>2025</span>
    </div>
  </div>
</body>
</html>
